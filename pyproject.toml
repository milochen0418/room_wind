[project]
name = "roomwind"
version = "0.1.0"
description = "Gapless looping playback of RoomWind2.MP3"
requires-python = ">=3.10"
dependencies = [
    "numpy (>=1.26)",
    "sounddevice (>=0.4.6)",
]

[project.scripts]
roomwind = "roomwind.loop_play:main"

[tool.poetry]
packages = [{ include = "roomwind" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
